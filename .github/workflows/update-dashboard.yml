name: Update Dashboard

on:
  schedule:
    - cron: "30 7 * * 1-5" # weekdays 07:30 UTC = 08:30 UK in summer (07:30 in winter — cron has no timezone)
  workflow_dispatch:
    inputs:
      post_digest:
        description: "Also post the aging-WIP digest to Google Chat"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments must not overlap or be cancelled mid-flight; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Fetch Data and Build
    # Personal account — Twinkl WarpBuild runners are not available here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Fetch issues
        run: node fetch-issues.js
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      - name: Fetch changelogs
        run: node fetch-changelogs.js
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      - name: Build dashboard
        run: node build.js
      - name: Verify build
        run: node test.js
      - name: Stage site
        run: mkdir -p _site && cp dashboard.html _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  notify:
    name: Aging WIP Digest
    # daily digest on the schedule only — a manual dashboard refresh must not
    # re-ping people unless explicitly asked to via the dispatch input
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.post_digest)
    runs-on: ubuntu-latest
    permissions:
      contents: read # no Pages/OIDC permissions needed here
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Post digest to Google Chat
        run: node notify.js
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          GCHAT_USER_MAP: ${{ secrets.GCHAT_USER_MAP }}
          WIP_THRESHOLD_DAYS: "5"

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
